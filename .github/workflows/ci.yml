name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress PR runs when new commits arrive — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check Astro define:vars + dynamic imports
        # Fails when a <script define:vars …> block contains a dynamic
        # `import(` call. define:vars implicitly enables is:inline, which
        # disables bundling — the import 404s at runtime against the
        # page URL. See CLAUDE.md "Astro define:vars + dynamic-import
        # pitfall" and PR #825.
        run: npm run check:define-vars

      - name: Unit tests (Vitest)
        run: npm test

      - name: Coverage floor (#1174)
        # Re-runs the unit suite with v8 coverage, parses
        # coverage/coverage-summary.json, compares against
        # tests/coverage-floor.txt, fails when current < floor.
        # The json-summary reporter is wired into vitest.config.ts's
        # coverage.reporter array — do NOT pass --reporter=json-summary
        # to vitest itself (that's the *test* reporter, not the
        # coverage reporter, and it 404s the loader).
        run: |
          set -euo pipefail
          npm run test:coverage 2>&1 | tail -5
          CURRENT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          FLOOR=$(grep -v '^#' tests/coverage-floor.txt | tail -n1)
          DELTA=$(awk -v c="$CURRENT" -v f="$FLOOR" 'BEGIN{printf "%.2f", c-f}')
          {
            echo "## Coverage report"
            echo ""
            echo "Lines coverage: ${CURRENT}% (floor: ${FLOOR}%, delta: ${DELTA}%)"
            echo ""
            echo "| current | floor | delta |"
            echo "|---:|---:|---:|"
            echo "| ${CURRENT}% | ${FLOOR}% | ${DELTA}% |"
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$CURRENT" -v f="$FLOOR" 'BEGIN{exit (c<f)?1:0}'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Edge Function contract tests (Deno)
        # --no-check because EF files import from `npm:` and remote URLs
        # whose types we don't ship locally; typechecking them would force
        # network fetches at test time. The contract tests assert
        # request-shape behaviour at the handler boundary — type
        # correctness is enforced by tsc on the PWA side and by deploy
        # smoke on the EF side (issue #1031 Tier 1a).
        run: npm run test:functions

      - name: CLI build + tests (cli/, M30)
        # Skipped if cli/ is missing on the branch; otherwise installs,
        # builds, and runs the Node native test runner. Matches what
        # operators run locally — keeps the M30 surface gated by CI.
        run: |
          if [ -d cli ]; then
            cd cli
            npm install --no-audit --no-fund
            npm run build
            npm test
          else
            echo "cli/ not present on this branch — skipping"
          fi

      - name: Build (static site)
        # PostHog secrets (PUBLIC_POSTHOG_*) are deliberately NOT passed here —
        # CI builds shouldn't fire capture events into prod analytics. Only
        # deploy.yml gets them. See docs/runbooks/posthog.md.
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL:       ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY:  ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_R2_MEDIA_URL:       ${{ secrets.PUBLIC_R2_MEDIA_URL }}
          PUBLIC_R2_TILES_URL:       ${{ secrets.PUBLIC_R2_TILES_URL }}

      - name: Verify search-index up to date
        # public/search-index.{en,es}.json is regenerated on every build; if a
        # PR edits the i18n routes/docs without rebuilding + committing, prod
        # ⌘K search would silently miss new entries. Fail loudly here.
        run: |
          if ! git diff --exit-code public/search-index.en.json public/search-index.es.json; then
            echo "::error::public/search-index.{en,es}.json drift detected. Run 'npm run build' locally and commit the regenerated files."
            exit 1
          fi

      - name: Report bundle size
        run: |
          echo "## Build size" >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Largest files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) \
            -exec du -h {} + | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

