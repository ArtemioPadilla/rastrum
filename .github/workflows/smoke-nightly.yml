name: Smoke Test – Nightly

on:
  schedule:
    # 08:00 UTC daily (02:00 CST)
    - cron: '0 8 * * *'
  workflow_dispatch: {}

concurrency:
  group: smoke-nightly
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke – Chromium vs production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        env:
          BASE_URL: https://rastrum.org
          PLAYWRIGHT_BASE_URL: https://rastrum.org
        run: npx playwright test --project=chromium tests/smoke/

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nightly-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
