project_id = "rastrum"

[db]
major_version = 17
port = 54322
shadow_port = 54320

[functions.get-upload-url]
enabled = true
verify_jwt = true

[functions.identify]
enabled = true
# verify_jwt = false: identify self-gates auth (resolves the JWT via
# auth.getUser when present, falls back to anon IP rate-limiting otherwise —
# index.ts:451-534). Edge-layer verify_jwt rejects the sb_publishable_* key
# as a non-JWT before the function runs, so anon + session-lock-fallback
# calls 401 with UNAUTHORIZED_INVALID_JWT_FORMAT and never reach the code.
# Mirrors api/mcp/share-card. Must also be in OTHER_NO_JWT in
# .github/workflows/deploy-functions.yml or the deploy re-enables it.
verify_jwt = false

# enrich-environment is NOT cron-only — it is invoked from the sync pipeline
# with a real user JWT, so Edge-layer JWT verification stays on.
[functions.enrich-environment]
enabled = true
verify_jwt = true

# Cron-only functions self-gate on X-Cron-Secret via _shared/cron-auth.ts
# (requireCronSecret). pg_cron calls them with no Authorization bearer, so
# Edge-layer verify_jwt would 401 at the gateway before the function code
# (and the X-Cron-Secret check) ever runs. These MUST be verify_jwt = false
# here AND listed in CRON_ONLY in .github/workflows/deploy-functions.yml —
# the deploy flag is authoritative in prod, but both sites must agree or a
# config-driven deploy / local serve silently re-enables JWT.
[functions.recompute-streaks]
enabled = true
verify_jwt = false

[functions.award-badges]
enabled = true
verify_jwt = false

[functions.kairos-fire]
enabled = true
verify_jwt = false

[functions.recompute-taxa-cache]
enabled = true
verify_jwt = false

[functions.weekly-digest]
enabled = true
verify_jwt = false

[functions.refresh-conservation-status]
enabled = true
verify_jwt = false

[functions.share-card]
enabled = true
verify_jwt = false

# delete-observation self-gates auth in-handler: extracts the Authorization
# header, calls auth.getUser(), and returns 401 itself (index.ts:82-88).
# With Edge-layer verify_jwt = true (the default), the Supabase gateway
# rejects both the OPTIONS preflight and the POST before the function code
# runs → the browser sees "Failed to fetch" / "Failed to send a request to
# the Edge Function". Disabling Edge-layer verification here does NOT
# weaken security — the handler enforces ownership (observer_id check) and
# uses service_role only after that gate passes. Must also be in
# OTHER_NO_JWT in .github/workflows/deploy-functions.yml (deploy flag wins
# in prod; both sites kept in sync). Ref #1093.
[functions.delete-observation]
enabled = true
verify_jwt = false

# sponsorships self-gates both paths: a user JWT via auth.getUser for the
# SponsoringView UI calls, and a Bearer cron token for the weekly
# ai_credentials_heartbeat job. The cron token is not a JWT, so edge-layer
# verify_jwt 401'd the heartbeat at the gateway. Must also be in
# OTHER_NO_JWT in .github/workflows/deploy-functions.yml (deploy flag wins
# in prod; both sites kept in sync).
[functions.sponsorships]
enabled = true
verify_jwt = false
